name: Deploy SupaChat to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          script: |
            cd ~/supabase-chat || git clone ${{ github.server_url }}/${{ github.repository }} ~/supabase-chat
            cd ~/supabase-chat
            git pull origin main
            
            if ! command -v docker-compose &> /dev/null
            then
                echo "Installing Docker..."
                sudo apt-get update
                sudo apt-get install -y docker.io
                sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
                sudo chmod +x /usr/local/bin/docker-compose
            fi
            
            # Export secrets
            export OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            export SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            export SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            
            # Rebuild and restart with modern docker compose plugin
            sudo -E docker-compose up -d --build
