name: Deploy SupaChat to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          script: |
            cd ~/supabase-chat || git clone ${{ github.server_url }}/${{ github.repository }} ~/supabase-chat
            cd ~/supabase-chat
            git pull origin main
            
            echo "Force installing Docker Compose V2..."
            sudo apt-get remove -y docker-compose
            sudo apt-get update
            sudo apt-get install -y docker.io
            sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-$(uname -s)-$(uname -m)" -o /usr/bin/docker-compose
            sudo chmod +x /usr/bin/docker-compose
            
            # Export secrets
            export OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            export SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            export SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            
            # Rebuild and restart with modern docker compose plugin
            sudo -E docker-compose up -d --build
